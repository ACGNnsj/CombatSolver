name: 故障反馈
description: 提交计算失败、计划外重算、选牌或执行异常
title: "[反馈] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "已有社区任务请在原任务留言；认领见 CONTRIBUTING.md。问题包从游戏设置导出，上传前检查个人信息，勿附游戏 DLL 或凭据。"
  - type: textarea
    id: behavior
    attributes:
      label: 发生了什么
      description: 操作、实际结果和预期结果
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: 游戏、CombatSolver 与 RitsuLib 版本
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 问题包或日志证据
      description: 附 ZIP、报告 ID 或首个异常；材料不足也请说明
